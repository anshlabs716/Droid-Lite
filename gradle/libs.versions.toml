[versions]
activity = "1.13.0"
agp = "9.4.1"
coil = "3.6.3"
compose-bom = "2026.09.00"
compose-libs = "1.13.0-beta02"
compose-material = "1.5.0-beta02"
coroutines = "1.11.0"
desugar = "2.1.5"
gradle-toolchains = "1.0.0"
hiddenapi-bypass = "6.2"
immutables = "0.5.2"
junit-jupiter = "6.1.3"
koin = "4.2.2"
koin-plugin = "1.2.1"
kotlin = "2.4.21"
ksp = "2.3.11"
leakcanary = "2.14"
libsu = "6.0.0"
lifecycle = "2.11.0"
okhttp = "5.5.0"
room = "2.8.5"
serialization = "1.12.0"
shizuku = "13.1.5"
shizuku-hidden = "4.4.0"
shizuku-refine = "4.4.0"
work = "2.12.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
jdk-desugar = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar" }
ksp = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "immutables" }

work-runtime = { module = "androidx.work:work-runtime", version.ref = "work" }
koin-bom = { group = "io.insert-koin", name = "koin-bom", version.ref = "koin" }
koin-core = { group = "io.insert-koin", name = "koin-core" }
koin-android = { group = "io.insert-koin", name = "koin-android" }
koin-workmanager = { group = "io.insert-koin", name = "koin-androidx-workmanager" }
koin-compose = { group = "io.insert-koin", name = "koin-androidx-compose" }
koin-startup = { group = "io.insert-koin", name = "koin-androidx-startup" }

coil-bom = { group = "io.coil-kt.coil3", name = "coil-bom", version.ref = "coil" }
coil = { group = "io.coil-kt.coil3", name = "coil" }
coil-okhttp = { group = "io.coil-kt.coil3", name = "coil-network-okhttp" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

libsu-core = { module = "com.github.topjohnwu.libsu:core", version.ref = "libsu" }
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
shizuku-hidden = { module = "dev.rikka.hidden:stub", version.ref = "shizuku-hidden" }
shizuku-refine = { module = "dev.rikka.tools.refine:runtime", version.ref = "shizuku-refine" }
hiddenapi-bypass = { module = "org.lsposed.hiddenapibypass:hiddenapibypass", version.ref = "hiddenapi-bypass" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }

lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose-libs" }
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose-libs" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose-libs" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material" }
compose-animation = { module = "androidx.compose.animation:animation", version.ref = "compose-libs" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "compose-libs" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose-libs" }

# Test
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-jupiter-params = { group = "org.junit.jupiter", name = "junit-jupiter-params", version.ref = "junit-jupiter" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
gradle-toolchains = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "gradle-toolchains" }
koin = { id = "io.insert-koin.compiler.plugin", version.ref = "koin-plugin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
shizuku-refine = { id = "dev.rikka.tools.refine", version.ref = "shizuku-refine" }
